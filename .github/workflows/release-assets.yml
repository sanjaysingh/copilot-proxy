name: Release Assets

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  package:
    name: Attach npm package tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Pack release tarball
        id: pack
        run: |
          package_file="$(npm pack --json | node -e "let data = ''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data)[0].filename));")"
          echo "package_file=${package_file}" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.pack.outputs.package_file }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
